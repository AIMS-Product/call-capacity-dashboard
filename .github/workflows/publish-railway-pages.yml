name: Publish Railway Dashboard to Pages

on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import validated Railway release
        id: mirror
        run: python3 .github/scripts/sync_railway_pages.py
      - uses: actions/configure-pages@v5
        if: steps.mirror.outputs.deploy == 'true'
      - name: Stage published dashboard files
        if: steps.mirror.outputs.deploy == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/dashboard-pages"
          git archive HEAD -- index.html archive.html archive changelog.html railway-release.json | tar -x -C "${RUNNER_TEMP}/dashboard-pages"
      - uses: actions/upload-pages-artifact@v3
        if: steps.mirror.outputs.deploy == 'true'
        with:
          path: ${{ runner.temp }}/dashboard-pages
      - name: Deploy dashboard
        if: steps.mirror.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
