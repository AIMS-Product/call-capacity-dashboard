name: Dedupe Bookings

# Reconciliation sweep for duplicate Calendly bookings / duplicate leads.
# Notify-only (v1): emails an alert when an invitee holds 2+ upcoming meetings.
# Reuses the dashboard repo's existing secrets — no new infra.

on:
  # cron-job.org dispatches the sweep every two hours using this same entry point.
  workflow_dispatch: {}

# Read-only job: no commits, so no elevated permissions needed.
permissions:
  contents: read

concurrency:
  # Don't let a slow run overlap the next scheduled one.
  group: dedupe-bookings
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run duplicate-booking sweep
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          CALENDLY_API_KEY: ${{ secrets.CALENDLY_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Alerts go to TEST_EMAIL_TO (just you) while testing — deliberately NOT
          # the EOD distro. To send to the team later, add EMAIL_TO here and set
          # RECIPIENT_SECRET = "EMAIL_TO" in dedupe_bookings.py.
          TEST_EMAIL_TO: ${{ secrets.TEST_EMAIL_TO }}
        run: python dedupe_bookings.py
